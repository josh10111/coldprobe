name: worker-gpu-image

on:
  # On handler changes too: a GPU image on an old handler would silently measure the wrong code.
  push:
    branches:
      - main
      - build/mvp
    paths:
      - "worker/Dockerfile.gpu"
      - "worker/handler.py"
      - "worker/requirements.txt"
      - ".github/workflows/worker-gpu-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # The ~14 GB runner can't hold the image both compressed (4.3 GB) and unpacked (~8 GB).
      # Not all of /opt/hostedtoolcache: setup-python installs there.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test handler
        working-directory: worker
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is what endpoints use; :sha-<short> lets a benchmark name the exact image.
      - uses: docker/build-push-action@v7
        with:
          context: worker
          file: worker/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          # A plain image, not an index with an unknown/unknown manifest that some pullers reject.
          provenance: false
          tags: |
            ghcr.io/josh10111/coldprobe-worker-gpu:latest
            ghcr.io/josh10111/coldprobe-worker-gpu:sha-${{ steps.sha.outputs.short }}
