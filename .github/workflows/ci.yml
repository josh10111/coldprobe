name: ci

on:
  push:
  pull_request:
  # Push/PR scans only cover their commit range; these rescan full history (e.g. after a new rule).
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # off the hour to avoid queue spikes

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Tests the floor go.mod declares, not whatever is newest.
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # The image workflows only run on some branches; this tests the handler on any branch.
  worker:
    runs-on: ubuntu-latest
    # Job-level, not workflow-wide: gitleaks-action needs GITHUB_TOKEN's default permissions.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r worker/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: worker

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
